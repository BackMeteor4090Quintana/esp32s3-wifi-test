name: COCODRILO limpio ESP32-S3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Instalar ESP32 core 3.2.1 limpio
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.2.1

      - name: Verificar entorno limpio
        run: |
          echo "Core instalado:"
          arduino-cli core list
          echo
          echo "NO se reemplaza platform.txt"
          echo "NO se usa build_support/platform.txt"
          echo "NO se aplican flags -Ofast / -flto de Anemoia"

      - name: Compilar COCODRILO OS
        run: |
          mkdir -p build

          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PartitionScheme=custom,PSRAM=opi" \
            --libraries "$GITHUB_WORKSPACE/libraries" \
            --build-property "compiler.cpp.extra_flags=-DOPTIMIZATION_FLAGS" \
            --output-dir build \
            --export-binaries \
            ArcadeConsola_s3_Imagenes_Embebidas.ino

      - name: Listar binarios
        run: |
          echo "=== ARCHIVOS GENERADOS ==="
          find build -type f -printf "%p %s bytes\n" | sort

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cocodrilo-limpio-esp32s3
          path: build/
          if-no-files-found: error
