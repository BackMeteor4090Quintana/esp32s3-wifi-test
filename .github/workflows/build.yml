name: ESP32-S3 WiFi test limpio

on:
  workflow_dispatch:
  push:
    paths:
      - "esp32s3-wifi-test.ino"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configurar ESP32
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.2.1

      - name: Compilar
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi" \
            --output-dir build \
            --export-binaries \
            esp32s3-wifi-test.ino

      - name: Listar binarios
        run: |
          find build -type f -printf "%p %s bytes\n" | sort

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-wifi-test
          path: build/
          if-no-files-found: error
